<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>環境監測現場助手 Professional</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>環境監測現場助手</h1>
      <p>Professional V1｜照片管理核心版</p>
    </div>
    <button id="settingsBtn" class="icon-btn">⚙️</button>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav">
    <button data-view="projects" class="active">📂<span>案件</span></button>
    <button data-view="check">✅<span>檢查</span></button>
    <button data-view="export">📦<span>匯出</span></button>
  </nav>

  <input id="photoInput" type="file" accept="image/*" multiple hidden>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <div id="modalBody"></div>
      <div class="dialog-actions">
        <button value="cancel" class="ghost">取消</button>
        <button id="modalConfirm" value="default" class="primary">確定</button>
      </div>
    </form>
  </dialog>

  <dialog id="photoViewer">
    <div class="viewer-header">
      <strong id="viewerTitle"></strong>
      <button id="closeViewer" class="icon-btn">✕</button>
    </div>
    <div id="viewerGrid" class="photo-grid"></div>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="js/jszip.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/project.js"></script>
  <script src="js/photo.js"></script>
  <script src="js/export.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
